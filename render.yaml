services:
  - type: web
    name: stk-academy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/stk-academy.sqlite
      - key: JWT_SECRET
        generateValue: true
