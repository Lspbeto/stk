services:
  - type: web
    name: stk-academy
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: stk-academy-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/stk-academy.sqlite
      - key: JWT_SECRET
        generateValue: true
